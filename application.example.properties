# AutoGest - Configuración de base de datos de ejemplo.
# Copia este archivo a application.local.properties y completa los valores reales.
# El archivo real (application.local.properties) está ignorado por .gitignore y
# nunca debe subirse al repositorio: contiene las credenciales de Supabase.
# No incrustes usuario ni contraseña dentro de db.url: van en db.user y db.password.

db.url=jdbc:postgresql://db.example.supabase.co:5432/postgres
db.user=your-database-user
db.password=your-database-password

# --- Correo de los avisos al cliente (opcional) -------------------------------
# Sin estas claves los avisos por correo se simulan (quedan como "Enviada" sin
# salir del equipo). Para enviarlos de verdad con Gmail:
#   1. Activa la verificación en dos pasos en la cuenta de Google del taller.
#   2. Crea una contraseña de aplicación en https://myaccount.google.com/apppasswords
#   3. Escribe aquí la dirección y esa contraseña (16 letras; los espacios se ignoran).
# Nunca uses la contraseña normal de la cuenta ni subas este archivo a Git.
#mail.username=taller@gmail.com
#mail.password=abcd efgh ijkl mnop
#mail.from.name=Taller AutoGest
# Valores por defecto (Gmail); cámbialos solo para otro proveedor:
#mail.smtp.host=smtp.gmail.com
#mail.smtp.port=587
#mail.smtp.starttls=true
